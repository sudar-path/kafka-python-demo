          jq --version

      - name: Check Docker
        run: |
          docker --version
          docker compose version
          docker ps

      - name: Check Kafka
        run: |
          docker exec kafka \
            /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --list   
